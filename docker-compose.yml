services:
  db:
    image: postgres:16-alpine
    container_name: reportsystem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reportsystem-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9443:9443"
    environment:
      DATABASE_URL: postgresql://reports:reports@db:5432/reports
      SECRET_KEY: ${SECRET_KEY}
      DEEPGRAM_KEY: ${DEEPGRAM_KEY:-}
      NIM_KEY: ${NIM_KEY:-}
      SEED_DEMO_REPORTS: ${SEED_DEMO_REPORTS:-1}
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9443/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
